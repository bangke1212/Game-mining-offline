format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: flutter

trigger_map:
  - push_branch: main
    workflow: build
  - pull_request_source_branch: '*'
    workflow: build

workflows:
  build:
    steps:
      - git-clone@8: {}

      - flutter-installer@1:
          inputs:
            # Flutter 3.22.3 includes Dart 3.4.x and satisfies pubspec.yaml.
            - version: 3.22.3

      - script@1:
          title: Verify Flutter and Dart versions
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                flutter --version
                dart --version 2>&1 | tee /tmp/dart-version.txt
                grep -Eq 'Dart SDK version: 3\.(3|[4-9]|[1-9][0-9])\.' /tmp/dart-version.txt

      - script@1:
          title: Install Flutter dependencies
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                flutter pub get

      - flutter-test@1:
          inputs:
            - project_location: '$BITRISE_FLUTTER_PROJECT_LOCATION'

      - flutter-build@0:
          inputs:
            - project_location: '$BITRISE_FLUTTER_PROJECT_LOCATION'
            - platform: android
            - android_output_type: apk
            - android_additional_params: '--debug'

      - deploy-to-bitrise-io@2: {}

app:
  envs:
    - BITRISE_FLUTTER_PROJECT_LOCATION: '.'
      opts:
        is_expand: false
