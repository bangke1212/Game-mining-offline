workflows:
  hashhaven-android:
    name: HashHaven Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Prepare Android project
        script: flutter create --platforms=android .
      - name: Install dependencies
        script: flutter pub get
      - name: Analyze Flutter project
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        script: flutter test
      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/**/*.apk
