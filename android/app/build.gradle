plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android { namespace 'com.hashhaven.app'; compileSdk = flutter.compileSdkVersion
    defaultConfig { applicationId 'com.hashhaven.app'; minSdk = 24; targetSdk = flutter.targetSdkVersion; versionCode = flutter.versionCode; versionName = flutter.versionName }
}

flutter { source '../..' }
